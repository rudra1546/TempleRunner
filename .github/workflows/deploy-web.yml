name: Deploy WebGL to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Raylib 5.5 source
        run: |
          mkdir -p third_party
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git third_party/raylib

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Verify Emscripten
        run: emcc --version

      - name: Build WebGL with CMake & Emscripten
        run: |
          emcmake cmake -B build-web -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web --config Release

      - name: Verify WebGL Build Artifacts
        run: |
          ls -la build-web/
          test -f build-web/index.html
          test -f build-web/index.js
          test -f build-web/index.wasm
          test -f build-web/index.data

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
